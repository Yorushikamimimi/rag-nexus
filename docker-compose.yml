# RAG-Nexus - 一键容器化编排
# 使用方式: docker-compose up -d --build

services:
  # 1. PostgreSQL + pgvector

  postgres-vector:
    # 使用 pgvector 官方镜像（pgvector/pgvector，原 ankane/pgvector 已归档）
    image: pgvector/pgvector:pg16
    container_name: rag-nexus-pgvector
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: postgres
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./init-pgvector.sql:/docker-entrypoint-initdb.d/01-init-vector.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d postgres"]
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks:
      - rag-nexus-net

  # 2. Spring Boot Java 后端

  java-backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: rag-nexus-java-backend
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres-vector:5432/postgres
      SPRING_DATASOURCE_USERNAME: postgres
      SPRING_DATASOURCE_PASSWORD: postgres
      # 显式启用 docker profile：加载 application-docker.yml，走阿里云 DashScope
      SPRING_PROFILES_ACTIVE: docker
      # API Key 必须由宿主机环境变量注入，镜像内不含任何 key
      AI_API_KEY: ${AI_API_KEY:?请通过环境变量提供 AI_API_KEY（阿里云 DashScope key）}
    ports:
      - "8080:8080"
    depends_on:
      postgres-vector:
        condition: service_healthy
    networks:
      - rag-nexus-net

  # 3. Vue 3 前端（Nginx）

  vue-frontend:
    build:
      context: ./rag-nexus-web
      dockerfile: Dockerfile
    container_name: rag-nexus-vue-frontend
    ports:
      - "80:80"
    depends_on:
      - java-backend
    networks:
      - rag-nexus-net

volumes:
  postgres_data:

networks:
  rag-nexus-net:
    driver: bridge
