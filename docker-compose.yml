# Yorushika AIGC 概念引擎 - 一键容器化编排
# 使用方式: docker-compose up -d

services:
  # 1. PostgreSQL + pgvector

  postgres-vector:
    # 使用 pgvector 官方镜像（ankane/pgvector 已归档）
    image: pgvector/pgvector:pg16
    container_name: rag-nexus-pgvector
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: ragnexus
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./init-pgvector.sql:/docker-entrypoint-initdb.d/01-init-vector.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d ragnexus"]
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks:
      - yorushika-net

  # 2. Python 抓取微服务

  python-scraper:
    build:
      context: .
      dockerfile: Dockerfile.python
    container_name: rag-nexus-python-scraper
    ports:
      - "8000:8000"
    # 可选：挂载 B 站 cookies.txt 以提升抓取成功率
    # volumes:
    #   - ./cookies.txt:/app/cookies.txt:ro
    networks:
      - yorushika-net

  # 3. Spring Boot Java 后端

  java-backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: rag-nexus-java-backend
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres-vector:5432/ragnexus
      SPRING_DATASOURCE_USERNAME: postgres
      SPRING_DATASOURCE_PASSWORD: postgres
      SCRAPER_SERVICE_URL: http://python-scraper:8000
      OPENAI_API_KEY: ${OPENAI_API_KEY:your-openai-api-key}
      # 若使用阿里云 DashScope，可覆盖：
      # AI_API_KEY: ${AI_API_KEY}
      # SPRING_PROFILES_ACTIVE: docker
    ports:
      - "8080:8080"
    depends_on:
      postgres-vector:
        condition: service_healthy
    networks:
      - yorushika-net

  # 4. Vue 3 前端（Nginx）

  vue-frontend:
    build:
      context: ./rag-nexus-web
      dockerfile: Dockerfile
    container_name: rag-nexus-vue-frontend
    ports:
      - "80:80"
    depends_on:
      - java-backend
    networks:
      - yorushika-net

volumes:
  postgres_data:

networks:
  yorushika-net:
    driver: bridge
